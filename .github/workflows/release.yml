name: Release Build

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  release:
    name: Release Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            targets: rpm
          - os: ubuntu-latest
            arch: arm64
            targets: rpm

    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: b5faaa3333cf11e8470c6e00ad2c95a812a1a809

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install dependencies
        env:
          SKIP_PREPARE: '1'
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        run: pnpm install

      - name: Download sidecar binaries
        run: pnpm prepare --${{ matrix.arch }}

      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Get Version (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: node -e "console.log('VERSION=' + require('./package.json').version)" >> "$GITHUB_ENV"

      - name: Build RPM
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        run: |
          pnpm web:build
          pnpm exec electron-builder --publish never --linux rpm --${{ matrix.arch }}

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: 'OutClash v${{ env.VERSION }}'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          files: |
            dist/OutClash*.rpm

  release-update:
    name: Release Update
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: b5faaa3333cf11e8470c6e00ad2c95a812a1a809

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install dependencies
        env:
          SKIP_PREPARE: '1'
        run: pnpm install

      - name: Get Version
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Release updater file
        run: pnpm updater

      - name: Upload latest.yml
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: latest.yml
